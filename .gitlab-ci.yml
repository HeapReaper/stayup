# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
- build
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

# ---- Container images ----
#
# Publishes the two images docker-compose.prod.yml pulls, both from the one
# Dockerfile in this repo:
#
#   $CI_REGISTRY_IMAGE/web      (target `runner`)        — Next.js app
#   $CI_REGISTRY_IMAGE/worker   (target `worker-runner`) — all five Go binaries
#
# Tags per build: the short SHA always, plus `latest` on the default branch
# and the git tag itself on a tagged pipeline. So a deployment can pin
# STAYUP_VERSION to a release tag, or track `latest`.
#
# Nothing here needs configuring: $CI_REGISTRY* are provided by GitLab and
# $CI_JOB_TOKEN can already push to this project's own registry.
.docker-build:
  stage: build
  image: docker:28-cli
  services:
  - docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
    # Multi-arch: set to e.g. "linux/amd64,linux/arm64" (per job, or as a
    # project CI/CD variable). The Go workers cross-compile natively (see the
    # go-builder stage), but the web image's `next build` would run under QEMU
    # emulation for the foreign arch — expect a much slower pipeline.
    PLATFORMS: linux/amd64
  before_script:
  # docker:*-cli doesn't ship the buildx plugin, and buildx is what makes the
  # registry cache below work: plain `docker build --cache-from` can only
  # reuse the final stage's layers, so every pipeline would redo `npm ci`,
  # `prisma generate` and `next build` from scratch.
  - apk add --no-cache docker-cli-buildx
  - docker buildx create --use --name stayup --driver docker-container
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
  - |
    TAGS="--tag $IMAGE:$CI_COMMIT_SHORT_SHA"
    [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && TAGS="$TAGS --tag $IMAGE:latest"
    [ -n "$CI_COMMIT_TAG" ] && TAGS="$TAGS --tag $IMAGE:$CI_COMMIT_TAG"

    docker buildx build \
      --target "$TARGET" \
      --platform "$PLATFORMS" \
      --cache-from "type=registry,ref=$IMAGE:buildcache" \
      --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
      --build-arg BUILD_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" \
      --build-arg BUILD_REVISION="$CI_COMMIT_SHA" \
      --provenance=false \
      $TAGS \
      --push .
  rules:
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Any other branch: buildable on demand, so an MR can be smoke-tested
  # without publishing `latest`.
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: manual
    allow_failure: true

build:web:
  extends: .docker-build
  variables:
    TARGET: runner
    IMAGE: $CI_REGISTRY_IMAGE/web

build:worker:
  extends: .docker-build
  variables:
    TARGET: worker-runner
    IMAGE: $CI_REGISTRY_IMAGE/worker
