# StayUp — the stack you deploy. Pulls pre-built images from the GitLab
# container registry, so nothing is built locally and this file works on its
# own: no repo checkout, no build context, no .env file next to it. Import it
# by URL in Portainer / Dokploy, or run it directly:
#
#   curl -O https://gitlab.com/HeapReaper/stayup/-/raw/main/docker-compose.yaml
#   BETTER_AUTH_SECRET=... POSTGRES_PASSWORD=... docker compose up -d
#
# Contributors building from source want docker-compose.build.yml instead
# (`docker compose -f docker-compose.build.yml up --build`). Coolify users want
# docker-compose.coolify.yaml, which drops the published host port in favour of
# Coolify's own proxy and generates both secrets itself.
#
# Two variables have no default on purpose — the stack refuses to start
# without them rather than booting with a guessable secret:
#
#   BETTER_AUTH_SECRET   long random string; signs session cookies.
#                        Generate with: openssl rand -base64 32
#   POSTGRES_PASSWORD    password for the bundled Postgres container. Letters
#                        and digits only (`openssl rand -hex 24`): it is
#                        substituted into DB_URL, and a URL's userinfo field
#                        can't carry @ / ? # [ ] % or spaces unescaped — the
#                        Go workers reject the connection string outright
#                        ("invalid userinfo") and restart-loop. Postgres reads
#                        it only when it creates its data directory, so
#                        changing it later does nothing until the volume goes.
#
# Everything else is optional (defaults in brackets):
#
#   STAYUP_VERSION       image tag to run [latest] — pin to a release tag
#   STAYUP_REGISTRY      registry/namespace holding the images
#                        [registry.gitlab.com/heapreaper/stayup]
#   PORT                 host + container port for the web UI [3000]
#   BETTER_AUTH_URL      public origin, e.g. https://status.example.com
#                        [http://localhost:$PORT]. Set this in production, to
#                        the exact origin the browser uses — scheme included,
#                        no trailing slash. better-auth validates every
#                        sign-in against it and answers "Invalid origin" on a
#                        mismatch, and behind a TLS-terminating proxy it can't
#                        infer the https:// by itself. It's also how the app
#                        recognises its own hostname when serving status pages
#                        on custom domains.
#   LOG_LEVEL            error | warning | info | debug [info]
#   SMTP_HOST/_PORT/_USER/_PASS/_FROM   fallback mail transport; can also be
#                        configured (and overridden) in Dashboard → Settings.
#   OIDC_CLIENT_ID/_CLIENT_SECRET/_DISCOVERY_URL  single sign-on. Set these
#                        three (plus OIDC_PROVIDER_NAME for the button label)
#                        and the sign-in page offers your identity provider
#                        alongside the password form. Register
#                        $BETTER_AUTH_URL/api/auth/callback/oidc as the
#                        redirect URI. OIDC_ALLOW_SIGNUP=false rejects IdP
#                        accounts that have no StayUp user yet;
#                        OIDC_DEFAULT_ROLE [Viewer] is what the ones it does
#                        create get.
#
# First run: open the app and register — that first account is the only one
# the public sign-up form ever creates, and it is an Admin. Everyone after
# that is invited from Dashboard → Users with a role: Admin (runs the
# instance), Member (runs the monitoring) or Viewer (reads).
#
# `web` reports healthy once /api/health answers 200, which means the database
# is reachable and migrated — that is what the workers below wait for. Worker
# liveness shows up on the dashboard and in that endpoint's body, but never
# fails the check: a dead worker must not restart the web container.
#
# To upgrade: `docker compose pull && docker compose up -d`.
# `web` runs `prisma migrate deploy` on every start, so schema changes apply
# themselves, and the workers wait for it to be healthy before starting.

x-app-env: &app-env
  DB_PROVIDER: postgresql
  DB_URL: postgresql://stayup:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/stayup
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 32)}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${PORT:-3000}}
  PORT: ${PORT:-3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-StayUp <noreply@example.com>}
  # Optional single sign-on (OIDC / OAuth). Left unset, nothing is
  # registered and the sign-in page shows only the password form. Register
  # $BETTER_AUTH_URL/api/auth/callback/${OIDC_PROVIDER_ID:-oidc} as the
  # redirect URI with your identity provider.
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-}
  OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
  OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-}
  OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-}
  OIDC_ALLOW_SIGNUP: ${OIDC_ALLOW_SIGNUP:-}
  OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-}

# Every worker is the same image with a different command, and none of them
# may start against a database that hasn't been migrated yet — hence waiting
# for `web` to be *healthy*, not merely started (only `web` carries Prisma).
x-worker: &worker
  image: ${STAYUP_REGISTRY:-registry.gitlab.com/heapreaper/stayup}/worker:${STAYUP_VERSION:-latest}
  restart: unless-stopped
  environment: *app-env
  volumes:
  - logs:/app/logs
  depends_on:
    postgres:
      condition: service_healthy
    web:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: stayup
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayup"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${STAYUP_REGISTRY:-registry.gitlab.com/heapreaper/stayup}/web:${STAYUP_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    ports:
    - "${PORT:-3000}:${PORT:-3000}"
    volumes:
    - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    healthcheck:
      # /api/health, not a page: it runs a real query, so this only goes
      # green once the database is reachable *and* migrate-deploy has applied
      # the schema — which is exactly what the workers below are waiting for.
      # Worker liveness is reported in the response body but never fails this
      # check; a dead worker must not restart the web container.
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # HTTP(s) monitors — GETs each URL.
  worker-https:
    <<: *worker
    command: ["/usr/local/bin/https"]

  # Port monitors — raw TCP connect to host:port.
  worker-port:
    <<: *worker
    command: ["/usr/local/bin/port"]

  # Ping monitors — native ICMP echo requests. NET_RAW is in Docker's default
  # capability set already; it's listed explicitly for hardened hosts and
  # runtimes that drop it, where ping checks would otherwise fail outright.
  worker-ping:
    <<: *worker
    cap_add:
    - NET_RAW
    command: ["/usr/local/bin/ping"]

  # DNS monitors — resolves each hostname's A record(s).
  worker-dns:
    <<: *worker
    command: ["/usr/local/bin/dns"]

  # Connection-level monitors — Postgres, MySQL, Redis, SMTP, IMAP, gRPC,
  # WebSocket and Domain (RDAP) checks. One worker for the whole family: they
  # all open a connection and exchange the minimum that proves the service is
  # really answering, and none is hot enough to deserve its own process.
  worker-probes:
    <<: *worker
    command: ["/usr/local/bin/probes"]

  # The one worker that checks monitors by *not* being called: Heartbeat
  # monitors are pinged by the job itself (cron, backup, import script) and
  # this marks them down when that ping stops arriving.
  worker-heartbeat:
    <<: *worker
    command: ["/usr/local/bin/heartbeat"]

  # Not a monitor checker: delivers queued notifications (Discord, Slack,
  # Webhook, Telegram, Email, PagerDuty, Push) and drives escalation policies.
  worker-integrations:
    <<: *worker
    command: ["/usr/local/bin/integrations"]

  # Housekeeping: rolls each finished day of checks up into a daily summary,
  # then deletes raw checks and finished notifications past their retention
  # (Dashboard → Settings → Monitoring). One pass at startup, then one per day.
  worker-janitor:
    <<: *worker
    command: ["/usr/local/bin/janitor"]

volumes:
  postgres-data:
  logs:
