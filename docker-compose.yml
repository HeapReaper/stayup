# Runs the whole stack: Postgres, Redis, the Next.js app, and all five
# monitor-check/notification workers.
#
# Quick start:
#   cp .env.example .env   # fill in BETTER_AUTH_SECRET, POSTGRES_PASSWORD, etc.
#   docker compose up --build
#
# `web` and every `worker-*` service build from the SAME Dockerfile (see
# Dockerfile) but different targets/commands: `web` is the Node/Next.js app
# (target `runner`), each `worker-*` is a statically-linked Go binary (target
# `worker-runner`) — no Node runtime in those containers at all, which is the
# whole point of the Go rewrite (a few MB of RSS per worker instead of a full
# V8 heap). DB_PROVIDER/DB_URL/REDIS_URL are forced to the in-network
# Postgres/Redis hostnames below regardless of what a local `.env` (meant for
# `npm run dev`) might otherwise say.
#
# Only `web` runs `prisma migrate deploy` — the Go workers don't carry Prisma
# (or Node) at all. Every worker-* service depends on `web` being healthy
# (not just started), and `web`'s healthcheck only passes once it's actually
# serving requests — i.e. after its migrate-deploy-then-start command has
# already applied the schema — so workers never race a cold, unmigrated
# database.

x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DB_PROVIDER: postgresql
    DB_URL: postgresql://stayup:${POSTGRES_PASSWORD:-stayup}@postgres:5432/stayup
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - logs:/app/logs

x-worker: &worker
  <<: *app
  build:
    context: .
    target: worker-runner
  depends_on:
    postgres:
      condition: service_healthy
    web:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayup}
      POSTGRES_DB: stayup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayup"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    <<: *app
    build:
      context: .
      target: runner
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/login >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker-https:
    <<: *worker
    command: ["/usr/local/bin/https"]

  worker-port:
    <<: *worker
    command: ["/usr/local/bin/port"]

  worker-ping:
    <<: *worker
    # Belt-and-suspenders for the raw ICMP socket the ping worker opens —
    # Docker's default capability set already includes NET_RAW, but some
    # hardened hosts/runtimes drop it.
    cap_add:
      - NET_RAW
    command: ["/usr/local/bin/ping"]

  worker-dns:
    <<: *worker
    command: ["/usr/local/bin/dns"]

  worker-integrations:
    <<: *worker
    command: ["/usr/local/bin/integrations"]

volumes:
  postgres-data:
  redis-data:
  logs:
