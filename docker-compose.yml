# Runs the whole stack: Postgres, Redis, the Next.js app, and all five
# monitor-check/notification workers.
#
# Quick start:
#   cp .env.example .env   # fill in BETTER_AUTH_SECRET, POSTGRES_PASSWORD, etc.
#   docker compose up --build
#
# `web` and every `worker-*` service run from the SAME image (see Dockerfile)
# — only the `command:` differs. DB_PROVIDER/DB_URL/REDIS_URL are forced to
# the in-network Postgres/Redis hostnames below regardless of what a local
# `.env` (meant for `npm run dev`) might otherwise say.
#
# No dedicated one-shot `migrate` service on purpose: each service below runs
# `prisma migrate deploy` itself before its actual command. That's safe to do
# from all 6 containers at once — Prisma serializes concurrent `migrate
# deploy` calls with a DB-level advisory lock, so whichever gets there first
# applies the migrations and the rest just see "already up to date". This
# used to be one shared `migrate` service that everything else waited on via
# `condition: service_completed_successfully`, but some deployment platforms
# (e.g. Coolify) don't handle an intentionally-exiting one-shot container in
# a compose stack well — every service here stays running, matching what
# those platforms expect.

x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DB_PROVIDER: postgresql
    DB_URL: postgresql://stayup:${POSTGRES_PASSWORD:-stayup}@postgres:5432/stayup
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - logs:/app/logs

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayup}
      POSTGRES_DB: stayup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayup"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    <<: *app
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker-https:
    <<: *app
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx src/workers/https.ts"]

  worker-port:
    <<: *app
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx src/workers/port.ts"]

  worker-ping:
    <<: *app
    # Belt-and-suspenders for the OS `ping` binary the worker shells out to —
    # Docker's default capability set already includes NET_RAW, but some
    # hardened hosts/runtimes drop it.
    cap_add:
      - NET_RAW
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx src/workers/ping.ts"]

  worker-dns:
    <<: *app
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx src/workers/dns.ts"]

  worker-integrations:
    <<: *app
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx src/workers/integrations.ts"]

volumes:
  postgres-data:
  redis-data:
  logs:
